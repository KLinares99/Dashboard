<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elevate Client Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f2f5; --border: #e3e6eb;
  --text: #14181f; --muted: #5d6573; --faint: #8a919d;
  --blue: #2563eb; --purple: #7c3aed; --orange: #d9620b; --green: #14935a; --teal: #0e8a8a; --pink: #c0267a;
  --urgent: #d42a2a; --urgent-bg: #fdecec; --waiting: #a36a00; --waiting-bg: #fdf4e1;
  --active: #14935a; --active-bg: #e6f6ee; --parked: #6b7280; --parked-bg: #eef0f3;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --surface: #161b22; --surface-2: #1d232c; --border: #2a313c;
    --text: #e8ebf0; --muted: #a0a8b5; --faint: #6f7885;
    --blue: #6b9cff; --purple: #a98bff; --orange: #f59a4a; --green: #3fcf8e; --teal: #3cc6c6; --pink: #f06fb0;
    --urgent: #ff6b6b; --urgent-bg: #3a1a1c; --waiting: #f2b84b; --waiting-bg: #36290f;
    --active: #3fcf8e; --active-bg: #10301f; --parked: #9aa3af; --parked-bg: #232932;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #161b22; --surface-2: #1d232c; --border: #2a313c;
  --text: #e8ebf0; --muted: #a0a8b5; --faint: #6f7885;
  --blue: #6b9cff; --purple: #a98bff; --orange: #f59a4a; --green: #3fcf8e; --teal: #3cc6c6; --pink: #f06fb0;
  --urgent: #ff6b6b; --urgent-bg: #3a1a1c; --waiting: #f2b84b; --waiting-bg: #36290f;
  --active: #3fcf8e; --active-bg: #10301f; --parked: #9aa3af; --parked-bg: #232932;
  --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, sans-serif; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
h1 { font-size: 26px; margin: 0; letter-spacing: -.02em; }
h1 span { color: var(--green); }
.sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.theme-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 32px 0 12px; font-weight: 600; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); }
.kpi .v { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
.kpi .l { color: var(--muted); font-size: 13px; }
.kpi.red .v { color: var(--urgent); }

/* Pipeline bar */
.pipe { display: flex; height: 36px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: var(--surface); }
.pipe div { display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* Timeline */
.tl { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 16px 12px; overflow-x: auto; box-shadow: var(--shadow); }
.tl-track { position: relative; min-width: 760px; height: 150px; }
.tl-line { position: absolute; left: 0; right: 0; top: 60px; height: 2px; background: var(--border); }
.tl-today { position: absolute; top: 20px; bottom: 10px; width: 2px; background: var(--urgent); }
.tl-today span { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 700; color: var(--urgent); white-space: nowrap; }
.tl-ev { position: absolute; top: 52px; transform: translateX(-50%); width: 110px; text-align: center; }
.tl-ev .dot { width: 18px; height: 18px; border-radius: 50%; margin: 0 auto; border: 3px solid var(--surface); box-shadow: 0 0 0 2px currentColor; background: currentColor; }
.tl-ev.done .dot { background: var(--surface); }
.tl-ev .d { font-size: 11px; font-weight: 700; margin-top: 6px; }
.tl-ev .t { font-size: 11px; color: var(--muted); line-height: 1.3; }
.tl-ev.up { top: 0; }
.tl-ev.up .dot { margin-top: 52px; }
.tl-ev.up .d, .tl-ev.up .t { position: absolute; left: 0; right: 0; }
.tl-ev.up .d { top: -2px; margin: 0; }
.tl-ev.up .t { top: 14px; }

/* Filters */
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

/* Cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; margin-top: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; border-top: 5px solid var(--c); }
.card-h { padding: 16px 16px 10px; display: flex; gap: 12px; align-items: flex-start; }
.avatar { width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; font-size: 22px; background: var(--surface-2); flex: none; }
.card-h .name { font-weight: 700; font-size: 17px; line-height: 1.2; }
.card-h .who { color: var(--muted); font-size: 13px; }
.pill { margin-left: auto; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
.s-urgent { color: var(--urgent); background: var(--urgent-bg); }
.s-active { color: var(--active); background: var(--active-bg); }
.s-waiting { color: var(--waiting); background: var(--waiting-bg); }
.s-parked, .s-done { color: var(--parked); background: var(--parked-bg); }
.card-b { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; background: var(--surface-2); color: var(--muted); padding: 2px 8px; border-radius: 6px; }
.tag.money { color: var(--text); font-weight: 600; }
.progress { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.bar { flex: 1; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c); border-radius: 99px; transition: width .3s; }
.next { background: var(--surface-2); border-left: 3px solid var(--c); border-radius: 6px; padding: 8px 10px; font-size: 14px; }
.next b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.owed { background: var(--urgent-bg); color: var(--urgent); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.owed b { font-size: 18px; display: block; }
.owed span { display: inline-block; margin-right: 10px; }
.block { font-size: 13px; color: var(--waiting); }
.block ul { margin: 4px 0 0; padding-left: 18px; }
details { border-top: 1px solid var(--border); }
summary { padding: 10px 16px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); list-style: none; display: flex; justify-content: space-between; }
summary::after { content: "▾"; }
details[open] summary::after { content: "▴"; }
.tasks { list-style: none; margin: 0; padding: 0 16px 14px; }
.tasks li { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; font-size: 14px; }
.tasks input { margin-top: 3px; accent-color: var(--c); width: 16px; height: 16px; flex: none; cursor: pointer; }
.tasks li.done span { color: var(--faint); text-decoration: line-through; }
.flag { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-left: 6px; text-transform: uppercase; }
.flag.urgent { color: var(--urgent); background: var(--urgent-bg); }
.flag.blocked { color: var(--waiting); background: var(--waiting-bg); }
.card a.nl { font-size: 13px; color: var(--c); text-decoration: none; font-weight: 600; }
.card a.nl:hover { text-decoration: underline; }

/* Focus list */
.focus { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
.focus-row { display: grid; grid-template-columns: 14px 170px 1fr auto; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
.focus-row:last-child { border-bottom: 0; }
.focus-row .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.focus-row .cn { font-weight: 600; }

/* Prospects */
.prospects { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.prospect { background: var(--surface); border: 1px dashed var(--border); border-radius: 12px; padding: 14px 16px; font-size: 14px; }
.prospect .n { font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.prospect .d { color: var(--muted); font-size: 13px; }
.note { font-size: 12px; color: var(--faint); margin-top: 24px; }

@media (max-width: 760px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .grid { grid-template-columns: 1fr; }
  .focus-row { grid-template-columns: 12px 1fr; }
  .focus-row .tx { grid-column: 2; }
  .focus-row .pill { grid-column: 2; justify-self: start; margin: 0; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span>Elevate</span> · Client Board</h1>
      <div class="sub" id="asof"></div>
    </div>
    <button class="theme-btn" id="theme" type="button">Toggle theme</button>
  </header>

  <section class="kpis" id="kpis"></section>

  <h2>Where the money comes from</h2>
  <div class="pipe" id="pipe"></div>
  <div class="legend" id="legend"></div>

  <h2>Timeline</h2>
  <div class="tl"><div class="tl-track" id="tl"></div></div>

  <h2>Do this first</h2>
  <div class="focus" id="focus"></div>

  <h2>All clients</h2>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>

  <h2>Prospects · on hold</h2>
  <div class="prospects" id="prospects"></div>

  <p class="note">Data lives in <code>clients.js</code>. Checking a box here is saved only in your browser. To make it permanent, update <code>clients.js</code> or Notion.</p>
</div>

<script src="clients.js"></script>
<script>
(function () {
  const D = window.ELEVATE_DATA;
  const $ = (id) => document.getElementById(id);
  const cssVar = (n) => `var(--${n})`;
  const STATUS = { urgent: "Needs action", active: "On track", waiting: "Waiting", done: "Done", parked: "Parked" };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // Theme
  const root = document.documentElement;
  try { const t = localStorage.getItem("eb-theme"); if (t) root.dataset.theme = t; } catch (e) {}
  $("theme").onclick = () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("eb-theme", root.dataset.theme); } catch (e) {}
  };

  // Per-browser checkbox overrides
  let checks = {};
  try { checks = JSON.parse(localStorage.getItem("eb-checks") || "{}"); } catch (e) {}
  const saveChecks = () => { try { localStorage.setItem("eb-checks", JSON.stringify(checks)); } catch (e) {} };
  const isDone = (c, i) => { const k = c.id + ":" + i; return k in checks ? checks[k] : !!c.tasks[i][1]; };

  const fmtDate = (s, opts) => new Date(s + "T12:00:00").toLocaleDateString("en-US", opts || { month: "short", day: "numeric" });
  const today = new Date(); today.setHours(12, 0, 0, 0);
  $("asof").textContent = `Today ${today.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })} · Notion synced ${fmtDate(D.asOf)}`;

  const byId = Object.fromEntries(D.clients.map((c) => [c.id, c]));
  const paying = D.clients.filter((c) => c.type !== "internal");

  function renderKpis() {
    let open = 0, urgent = 0;
    D.clients.forEach((c) => c.tasks.forEach((t, i) => { if (!isDone(c, i)) { open++; if (t[2] === "urgent") urgent++; } }));
    const mrr = paying.filter((c) => c.type === "retainer").reduce((a, c) => a + c.value, 0);
    const proj = paying.filter((c) => c.type === "project").reduce((a, c) => a + c.value, 0);
    const owed = D.clients.reduce((a, c) => a + (c.owed || []).reduce((x, o) => x + o[1], 0), 0);
    $("kpis").innerHTML = [
      [paying.length, "Active clients"],
      ["$" + mrr.toLocaleString(), "Monthly retainer"],
      ["$" + proj.toLocaleString(), "Project work in play"],
      ["$" + owed.toLocaleString(), "Unpaid · owed to you", owed ? "red" : ""],
      [urgent, `Urgent tasks · ${open} open total`, "red"],
    ].map(([v, l, cls]) => `<div class="kpi ${cls || ""}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");
  }

  function renderPipe() {
    const total = paying.reduce((a, c) => a + c.value, 0);
    $("pipe").innerHTML = paying.map((c) => {
      const pct = (c.value / total) * 100;
      return `<div style="width:${pct}%;background:${cssVar(c.color)}" title="${esc(c.name)}: ${esc(c.valueLabel)}">${pct > 12 ? "$" + c.value : ""}</div>`;
    }).join("");
    $("legend").innerHTML = paying.map((c) => `<span><i style="background:${cssVar(c.color)}"></i>${esc(c.name)} · ${esc(c.valueLabel)}</span>`).join("");
  }

  function renderTimeline() {
    const dates = D.timeline.map((e) => new Date(e.date + "T12:00:00"));
    const min = new Date(Math.min(...dates, today) - 3 * 864e5);
    const max = new Date(Math.max(...dates, today) + 3 * 864e5);
    const pos = (d) => ((d - min) / (max - min)) * 100;
    let html = `<div class="tl-line"></div><div class="tl-today" style="left:${pos(today)}%"><span>TODAY</span></div>`;
    D.timeline.forEach((e, i) => {
      const c = byId[e.client];
      const d = new Date(e.date + "T12:00:00");
      const late = !e.done && d < today;
      html += `<div class="tl-ev ${e.done ? "done" : ""} ${i % 2 ? "up" : ""}" style="left:${pos(d)}%;color:${cssVar(late ? "urgent" : c.color)}">
        <div class="dot"></div><div class="d">${fmtDate(e.date)}${late ? " · LATE" : ""}</div><div class="t">${esc(e.label)}</div></div>`;
    });
    $("tl").innerHTML = html;
  }

  function renderFocus() {
    const rows = [];
    D.clients.forEach((c) => c.tasks.forEach((t, i) => {
      if (!isDone(c, i) && (t[2] === "urgent" || t[2] === "blocked")) rows.push({ c, t });
    }));
    rows.sort((a, b) => (a.t[2] === "urgent" ? 0 : 1) - (b.t[2] === "urgent" ? 0 : 1));
    $("focus").innerHTML = rows.map(({ c, t }) => `<div class="focus-row" style="--c:${cssVar(c.color)}">
      <span class="sw"></span><span class="cn">${esc(c.name)}</span><span class="tx">${esc(t[0])}</span>
      <span class="pill ${t[2] === "urgent" ? "s-urgent" : "s-waiting"}">${t[2] === "urgent" ? "Urgent" : "Blocked"}</span></div>`).join("")
      || `<div class="focus-row"><span></span><span class="tx">Nothing urgent. Nice.</span></div>`;
  }

  let filter = "all";
  try { filter = localStorage.getItem("eb-filter") || "all"; } catch (e) {}
  function renderFilters() {
    const opts = [["all", "All"], ["urgent", "Needs action"], ["active", "On track"], ["waiting", "Waiting"], ["retainer", "Retainers"], ["project", "Projects"]];
    $("filters").innerHTML = opts.map(([k, l]) => {
      const n = k === "all" ? D.clients.length : D.clients.filter((c) => c.status === k || c.type === k).length;
      return `<button class="chip" type="button" data-f="${k}" aria-pressed="${filter === k}">${l} · ${n}</button>`;
    }).join("");
    $("filters").querySelectorAll(".chip").forEach((b) => b.onclick = () => {
      filter = b.dataset.f; try { localStorage.setItem("eb-filter", filter); } catch (e) {}
      renderFilters(); renderGrid();
    });
  }

  const openCards = new Set();
  function renderGrid() {
    const list = D.clients.filter((c) => filter === "all" || c.status === filter || c.type === filter);
    $("grid").innerHTML = list.map((c) => {
      const done = c.tasks.filter((_, i) => isDone(c, i)).length;
      const pct = Math.round((done / c.tasks.length) * 100);
      return `<article class="card" style="--c:${cssVar(c.color)}">
        <div class="card-h">
          <div class="avatar">${c.emoji}</div>
          <div><div class="name">${esc(c.name)}</div><div class="who">${esc(c.contact)}</div></div>
          <span class="pill s-${c.status}">${STATUS[c.status]}</span>
        </div>
        <div class="card-b">
          <div class="meta"><span class="tag money">${esc(c.valueLabel)}</span>${c.services.map((s) => `<span class="tag">${esc(s)}</span>`).join("")}</div>
          <div class="progress"><div class="bar"><i style="width:${pct}%"></i></div>${done}/${c.tasks.length} done</div>
          ${(c.owed || []).length ? `<div class="owed"><b>Owes $${c.owed.reduce((a, o) => a + o[1], 0).toLocaleString()}</b>${c.owed.map((o) => `<span>${esc(o[0])} · $${o[1]}</span>`).join("")}</div>` : ""}
          <div class="next"><b>Next step</b>${esc(c.next)}</div>
          ${c.blockers.length ? `<div class="block">⚠ Waiting on<ul>${c.blockers.map((b) => `<li>${esc(b)}</li>`).join("")}</ul></div>` : ""}
          <a class="nl" href="${esc(c.notion)}" target="_blank" rel="noopener">Open in Notion →</a>
        </div>
        <details data-id="${c.id}" ${openCards.has(c.id) ? "open" : ""}><summary>All tasks (${c.tasks.length})</summary>
          <ul class="tasks">${c.tasks.map((t, i) => {
            const d = isDone(c, i);
            return `<li class="${d ? "done" : ""}"><input type="checkbox" data-k="${c.id}:${i}" ${d ? "checked" : ""} aria-label="${esc(t[0])}">
              <span>${esc(t[0])}${!d && t[2] ? `<span class="flag ${t[2]}">${t[2]}</span>` : ""}</span></li>`;
          }).join("")}</ul>
        </details>
      </article>`;
    }).join("");
    $("grid").querySelectorAll("details").forEach((el) => el.ontoggle = () => el.open ? openCards.add(el.dataset.id) : openCards.delete(el.dataset.id));
    $("grid").querySelectorAll("input[type=checkbox]").forEach((cb) => cb.onchange = () => {
      checks[cb.dataset.k] = cb.checked; saveChecks(); renderAll();
    });
  }

  function renderProspects() {
    $("prospects").innerHTML = D.prospects.map((p) => `<div class="prospect">
      <div class="n">${esc(p.name)}<span class="pill s-${p.status}">${STATUS[p.status]}</span></div>
      <div class="d">${esc(p.detail)}</div><div>${esc(p.note)}</div></div>`).join("");
  }

  function renderAll() { renderKpis(); renderPipe(); renderTimeline(); renderFocus(); renderFilters(); renderGrid(); renderProspects(); }
  renderAll();
})();
</script>
</body>
</html>
